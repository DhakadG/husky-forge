name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      FORGE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libdbus-1-dev libfuse2
      - name: libheif via vcpkg (windows, static)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install libheif:x64-windows-static
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
          echo "VCPKGRS_TRIPLET=x64-windows-static" >> $GITHUB_ENV
          echo "FORGE_FEATURES=--features heic" >> $GITHUB_ENV
      - run: cargo build --release --workspace --target ${{ matrix.target }} $FORGE_FEATURES
        shell: bash

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V=${FORGE_VERSION#v}
          mkdir -p dist/win
          cp target/${{ matrix.target }}/release/husky-forge.exe target/${{ matrix.target }}/release/forge.exe README.md LICENSE dist/win/
          (cd dist/win && 7z a ../husky-forge-$V-windows-x64-portable.zip .)
          FORGE_VERSION=$V "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" packaging/windows.iss
          ls dist
      - name: package (macos)
        if: runner.os == 'macOS'
        run: |
          V=${FORGE_VERSION#v}
          ARCH=$([[ "${{ matrix.target }}" == aarch64* ]] && echo arm64 || echo x64)
          bash packaging/macos-bundle.sh ${{ matrix.target }} $V husky-forge-$V-macos-$ARCH.dmg
          tar czf husky-forge-$V-macos-$ARCH-cli.tar.gz -C target/${{ matrix.target }}/release forge
      - name: package (linux)
        if: runner.os == 'Linux'
        run: |
          V=${FORGE_VERSION#v}
          bash packaging/linux-appimage.sh ${{ matrix.target }} $V husky-forge-$V-linux-x64.AppImage
          tar czf husky-forge-$V-linux-x64.tar.gz -C target/${{ matrix.target }}/release husky-forge forge
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            *.dmg
            *.AppImage
            *.tar.gz
          generate_release_notes: true
