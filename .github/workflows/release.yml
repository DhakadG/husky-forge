name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: forge.exe
            archive: husky-forge-windows-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: forge
            archive: husky-forge-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin: forge
            archive: husky-forge-macos-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: forge
            archive: husky-forge-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p forge-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp README.md LICENSE dist/
          cd dist
          if [[ "${{ matrix.archive }}" == *.zip ]]; then 7z a ../${{ matrix.archive }} .; else tar czf ../${{ matrix.archive }} .; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
