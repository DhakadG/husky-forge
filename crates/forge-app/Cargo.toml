[package]
name = "forge-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "husky-forge"
path = "src/main.rs"

[features]
default = ["jxl"]
jxl = ["forge-core/jxl"]
heic = ["forge-core/heic"]

[dependencies]
forge-core = { path = "../forge-core", default-features = false }
anyhow = "1"
dirs = "6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
notify-rust = "4"
slint = { version = "1.18", features = ["raw-window-handle-06"] }
toml = "1"
ureq = { version = "3", features = ["json"] }
serde_json = "1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
window-vibrancy = "0.8"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
