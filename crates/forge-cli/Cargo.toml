[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
forge-core = { path = "../forge-core", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[features]
default = ["jxl"]
# libjxl needs cmake + clang-cl on Windows; `--no-default-features` on machines without them.
jxl = ["forge-core/jxl"]
heic = ["forge-core/heic"]
